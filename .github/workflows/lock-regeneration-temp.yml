name: Temporary lock regeneration

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate reviewed lock candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.4.1"
          pip-compile --resolver=backtracking --generate-hashes --output-file=/tmp/requirements.lock requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-requirements-lock
          path: /tmp/requirements.lock
          retention-days: 1
