name: Temporary lock regeneration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate reviewed lock
        run: |
          python -m pip install "pip==24.3.1" "pip-tools==7.4.1"
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
      - name: Verify the generated locked environment
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
          python -m pip install pip-audit
          pip-audit -r requirements.lock
      - name: Run the full test suite against the generated lock
        run: python -m pytest -q --tb=short
      - name: Commit regenerated lock to main
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "Lockfile already matches its declared inputs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git commit -m "chore: synchronize hash-locked dependencies"
          git push origin HEAD:main
