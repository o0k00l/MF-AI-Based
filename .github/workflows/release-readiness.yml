name: Release readiness gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gates:
    name: Release / production evidence gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require a hash-locked dependency set
        run: |
          if [ ! -f requirements.lock ]; then
            echo "::error::requirements.lock is missing. Generate and review a hash-locked lockfile before creating a production release."
            exit 1
          fi
      - name: Install locked dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Run P0 and correctness suites
        run: |
          python -m pytest test_p0_fiduciary_invariants.py -v --tb=short
          python -m pytest tests/test_p0_correctness_regressions.py -v --tb=short
      - name: Run universal policy validation
        run: python validate_final_logics.py
      - name: Require production-grade TRI evidence
        run: python verify_tri_provenance.py --require-alpha-release
