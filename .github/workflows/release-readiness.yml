name: SIP production release gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sip-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gates:
    timeout-minutes: 50
    name: SIP / exact-commit production evidence gates
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for exact-main ancestry check
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm release commit is reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify the lock matches declared dependency constraints
        run: |
          python -m pip install "pip==24.3.1" "pip-tools==7.4.1"
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
          git diff --exit-code -- requirements.lock
      - name: Install locked dependencies only
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Compile SIP backend, ingestion and supporting modules
        run: python -m compileall -q api core ingestion services tax
      - name: Run P0 fiduciary and correctness suites
        run: |
          python -m pytest tests/test_p0_fiduciary_invariants.py -v --tb=short
          python -m pytest tests/test_p0_correctness_regressions.py -v --tb=short
      - name: Run complete repository regression suite
        run: python -m pytest -q --tb=short -rs
      - name: Run policy and privacy boundary checks
        run: |
          python validate_final_logics.py
          python -m pytest tests/test_pdf_exporter.py tests/test_clean_checkout.py tests/test_ai_privacy_boundary.py tests/test_privacy_prompt_minimization.py -v --tb=short
      - name: Audit hash-locked dependencies
        run: |
          python -m pip install "pip-audit==2.9.0"
          pip-audit -r requirements.lock
      - name: Generate CycloneDX dependency SBOM
        run: pip-audit -r requirements.lock --format cyclonedx-json --output dependency-sbom.cdx.json
      - name: Retain release dependency SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sip-release-dependency-sbom-${{ github.sha }}
          path: dependency-sbom.cdx.json
          retention-days: 90
      - name: Require signed production-grade TRI and calendar evidence
        env:
          TRI_REVIEWER_TRUST_REGISTRY_JSON: ${{ secrets.TRI_REVIEWER_TRUST_REGISTRY_JSON }}
          TRI_REVIEWER_APPROVAL_JSON: ${{ secrets.TRI_REVIEWER_APPROVAL_JSON }}
        run: python verify_tri_provenance.py --require-alpha-release --expected-commit ${{ github.sha }}
      - name: Record release boundary
        if: always()
        run: |
          {
            echo "## SIP production release gate"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- This workflow does not itself configure branch protection or production-environment reviewers."
            echo "- A successful run is necessary but not sufficient: independent research/policy, privacy/security, API access-control and owner-operated credential/history approvals must also be recorded."
            echo "- Lumpsum/STP, tax, redemption, switching and trade execution are outside this SIP release."
          } >> "$GITHUB_STEP_SUMMARY"
