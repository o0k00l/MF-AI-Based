name: Release readiness gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gates:
    timeout-minutes: 45
    name: Release / production evidence gates
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify the lock matches declared dependency constraints
        run: |
          python -m pip install "pip==24.3.1" "pip-tools==7.4.1"
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
          git diff --exit-code -- requirements.lock
      - name: Install locked dependencies only
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q core tax
      - name: Run P0 and correctness suites
        run: |
          python -m pytest test_p0_fiduciary_invariants.py -v --tb=short
          python -m pytest tests/test_p0_correctness_regressions.py -v --tb=short
      - name: Run complete repository test suite
        run: python -m pytest -q --tb=short
      - name: Run PDF export and clean-checkout tests
        run: |
          python -m pytest tests/test_pdf_exporter.py test_clean_checkout.py -v --tb=short
      - name: Run universal policy validation
        run: python validate_final_logics.py
      - name: Audit hash-locked dependencies
        run: |
          python -m pip install "pip-audit==2.9.0"
          pip-audit -r requirements.lock
      - name: Generate CycloneDX dependency SBOM
        run: pip-audit -r requirements.lock --format cyclonedx-json --output dependency-sbom.cdx.json
      - name: Retain release dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-dependency-sbom-${{ github.sha }}
          path: dependency-sbom.cdx.json
          retention-days: 90
      - name: Require signed production-grade TRI evidence
        env:
          TRI_REVIEWER_TRUST_REGISTRY_JSON: ${{ secrets.TRI_REVIEWER_TRUST_REGISTRY_JSON }}
          TRI_REVIEWER_APPROVAL_JSON: ${{ secrets.TRI_REVIEWER_APPROVAL_JSON }}
        run: python verify_tri_provenance.py --require-alpha-release --expected-commit ${{ github.sha }}
