name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Security / pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Install the reviewed hash-locked dependency set
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit the hash-locked dependency tree
        run: pip-audit -r requirements.lock
      - name: Generate CycloneDX dependency SBOM
        run: pip-audit -r requirements.lock --format cyclonedx-json --output dependency-sbom.cdx.json
      - name: Retain dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom-{{ github.sha }}
          path: dependency-sbom.cdx.json
          retention-days: 90
