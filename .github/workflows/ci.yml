name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock-consistency:
    name: Dependencies / lock matches declared constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install compatible lock tooling
        run: python -m pip install "pip==24.3.1" "pip-tools==7.4.1"
      - name: Verify requirements.lock is current
        run: pip-compile --check --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt

  p0-tests:
    name: P0 / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fiduciary-invariants
            command: python -m pytest test_p0_fiduciary_invariants.py -v --tb=short
          - suite: correctness-regressions
            command: python -m pytest tests/test_p0_correctness_regressions.py -v --tb=short
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.command }}

  full-test-suite:
    name: Tests / full repository suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run every discovered test
        run: python -m pytest -q --tb=short

  policy-validation:
    name: Policy / static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q core tax
      - name: Run universal policy validation
        run: python validate_final_logics.py
      - name: Test PDF export
        run: python -m pytest tests/test_pdf_exporter.py -v --tb=short
      - name: Test clean-checkout privacy boundary
        run: python -m pytest test_clean_checkout.py -v --tb=short

  tri-fixture-integrity:
    name: Benchmark / fixture integrity (not alpha approval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify checked-in TRI fixture checksums
        run: python verify_tri_provenance.py
      - name: Assert release gate remains blocked for provisional fixtures
        run: |
          set +e
          python verify_tri_provenance.py --require-alpha-release
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "Expected: alpha release is blocked until authenticated daily TRI and calendar evidence are supplied."
          else
            echo "Unexpected TRI release gate exit code: $status (expected 2 for current provisional fixtures)."
            exit 1
          fi
