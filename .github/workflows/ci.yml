name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  p0-invariants:
    name: P0 fiduciary invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P0 invariant suite
        run: python -m pytest test_p0_fiduciary_invariants.py -v --tb=short

  correctness-regressions:
    name: P0 correctness regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run correctness regression suite
        run: python -m pytest tests/test_p0_correctness_regressions.py -v --tb=short

  full-test-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run all collected tests
        run: python -m pytest -q -ra --tb=short

  universal-policy-validation:
    name: Universal policy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate policy logic
        run: python validate_final_logics.py

  tri-fixture-integrity:
    name: TRI fixture integrity and release-state validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify fixture checksums and explicit blocked release state
        run: python verify_tri_provenance.py

  tri-coverage:
    name: TRI coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify coverage from observed sessions
        run: python -m pytest test_p0_fiduciary_invariants.py::test_p0_16_tri_coverage_gate_uses_observed_sessions_not_metadata -v --tb=short

  secret-scan:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history for credentials and tokens
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-lock:
    name: Resolve hash-locked dependency set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned resolver
        run: python -m pip install pip==25.3 pip-tools==7.5.2
      - name: Resolve all direct and transitive dependencies with hashes
        run: pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
      - name: Upload reproducible lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability audit
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download generated hash lock
        uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install locked dependencies and audit tool
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pip-audit==2.10.1
      - name: Audit direct and transitive dependencies
        run: pip-audit -r requirements.lock
