name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  dependency-lock:
    name: Resolve hash-locked dependency set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned lock resolver
        run: python -m pip install pip==25.3 pip-tools==7.5.2
      - name: Resolve direct and transitive dependencies with hashes
        run: |
          set -euo pipefail
          pip-compile --index-url=https://pypi.org/simple --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
          if grep -Eq '^[[:space:]]*--no-index([[:space:]]|$)' requirements.lock; then
            echo "Invalid no-index directive in lockfile"
            exit 1
          fi
      - name: Upload generated hash lock
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
          if-no-files-found: error
          retention-days: 7
      - name: Commit lockfile to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: add Python 3.11 hash-locked dependencies"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  p0-invariants:
    name: P0 fiduciary invariants
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run P0 invariant suite
        run: python -m pytest test_p0_fiduciary_invariants.py -v --tb=short

  correctness-regressions:
    name: P0 correctness regressions
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run correctness regression suite
        run: python -m pytest tests/test_p0_correctness_regressions.py -v --tb=short

  full-test-suite:
    name: Full test suite
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run all collected tests
        run: python -m pytest -q -ra --tb=short

  universal-policy-validation:
    name: Universal policy validation
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate policy logic
        run: python validate_final_logics.py

  tri-fixture-integrity:
    name: TRI fixture integrity and release-state validation
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify fixture checksums and explicit blocked release state
        run: python verify_tri_provenance.py

  tri-coverage:
    name: TRI coverage gate
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify coverage from observed sessions
        run: python -m pytest test_p0_fiduciary_invariants.py::test_p0_16_tri_coverage_gate_uses_observed_sessions_not_metadata -v --tb=short

  dependency-audit:
    name: Dependency vulnerability audit
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
      - name: Install locked dependencies and audit tool
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pip-audit==2.10.1
      - name: Audit direct and transitive dependencies
        run: pip-audit -r requirements.lock

  secret-scan:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history for credentials and tokens
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
