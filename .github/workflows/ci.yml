name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run P0 Fiduciary Invariant Tests
        run: python -m pytest test_p0_fiduciary_invariants.py -v --tb=short

      - name: Run Universal Fiduciary Logic Validation
        run: python validate_final_logics.py

      - name: Verify TRI Fixture Provenance
        run: python -c "
import json
with open('data/policy/benchmark_tri_series_high_coverage.json') as f:
    data = json.load(f)
print('TRI Fixture Status:', data.get('status'))
print('Nifty 500 TRI points:', data['coverage']['nifty_500_tri']['provided_data_points'])
print('Nifty 50 TRI points:', data['coverage']['nifty_50_tri']['provided_data_points'])
print('Nifty 500 TRI coverage:', data['coverage']['nifty_500_tri']['coverage_pct'])
print('Nifty 50 TRI coverage:', data['coverage']['nifty_50_tri']['coverage_pct'])
"

      - name: Verify TRI Fixture Checksums
        run: python -c "
import json, hashlib
with open('data/policy/benchmark_tri_series_high_coverage.json') as f:
    data = json.load(f)
for idx in ['NIFTY 500 TRI', 'NIFTY 50 TRI']:
    levels = data['benchmarks'][idx]['levels']
    computed = hashlib.sha256(json.dumps(levels, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
    expected = data['provenance']['checksum_sha256_nifty_500_tri' if '500' in idx else 'checksum_sha256_nifty_50_tri']
    assert computed == expected, f'Checksum mismatch for {idx}'
    print(f'{idx}: checksum VERIFIED')
print('All checksums VERIFIED')
"

      - name: Run TRI Coverage Gate Test
        run: python -m pytest test_p0_fiduciary_invariants.py::test_p0_16_tri_coverage_gate_rejects_inflated_metadata -v